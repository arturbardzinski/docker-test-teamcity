[project]
name = "docker-test-teamcity"
version = "0.1.0"
description = "TeamCity Docker setup and Python tests"
requires-python = ">=3.14"
dependencies = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "allure-pytest>=2.14",
    "requests>=2.32",
    "typing-extensions>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
